spring.application.name=timecapsule
server.port=9090

spring.datasource.url=jdbc:mysql://localhost:3306/timecapsule?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Change this secret before deploying anywhere public (at least 32 characters)
app.jwt.secret=TimeCapsuleSecretKeyForJwtAuthentication123456789
app.jwt.expiration-minutes=10080

# Frontend address(es) allowed to call this API, comma separated
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Used inside emails
app.frontend-url=http://localhost:5173
app.timezone=Asia/Kolkata

# "Opens soon" reminder is sent this many hours before a capsule unlocks
app.capsule.reminder-hours=24

# ------------------------------------------------------------------
# EMAIL (Gmail). Fill in the 3 values below to send real emails.
# While spring.mail.host is commented out, every email is only printed in this console.
# ------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
