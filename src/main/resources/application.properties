spring.application.name=timecapsule

# Port configuration: Render provides the PORT env variable dynamically (defaults to 8080)
server.port=${PORT:9090}

# Database Configuration (Aiven MySQL defaultdb)
# JDBC URL requires sslMode=REQUIRED for Aiven Cloud MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Optimized for cloud database & sleep cycles)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=10080

# Frontend address(es) allowed to call this API (CORS)
# Supports localhost, custom domains, and Vercel (*.vercel.app)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# Frontend URL used inside email notification links
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# "Opens soon" reminder sent hours before capsule unlocks
app.capsule.reminder-hours=24

# ------------------------------------------------------------------
# EMAIL (Gmail SMTP)
# ------------------------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:timecapsuleoffic@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${APP_MAIL_FROM:TimeCapsule <timecapsuleoffic@gmail.com>}