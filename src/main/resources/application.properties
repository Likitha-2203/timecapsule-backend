spring.application.name=timecapsule

# Port configuration: Render provides the PORT env variable dynamically (defaults to 10000)
server.port=${PORT:10000}

# Database Configuration (Aiven MySQL defaultdb)
# JDBC URL requires sslMode=REQUIRED for Aiven Cloud MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-2bb1b630-timecapsule-2026.d.aivencloud.com:10816/defaultdb?sslMode=REQUIRED&connectTimeout=10000&socketTimeout=30000}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Optimized for cloud database & fast startup)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=15000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-minutes=10080

# Frontend address(es) allowed to call this API (CORS)
# Supports localhost, custom domains, and Vercel (*.vercel.app)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# Frontend URL used inside email notification links
app.frontend-url=${APP_FRONTEND_URL:https://timecapsule-frontend-ruddy.vercel.app}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# "Opens soon" reminder sent hours before capsule unlocks
app.capsule.reminder-hours=24

# ------------------------------------------------------------------
# EMAIL (HTTP API over HTTPS port 443 / Fallback to Gmail SMTP)
# ------------------------------------------------------------------
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.resend-api-key=${RESEND_API_KEY:}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:timecapsuleoffic@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${APP_MAIL_FROM:TimeCapsule <timecapsuleoffic@gmail.com>}